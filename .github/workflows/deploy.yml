name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-web/package-lock.json
      - run: npm ci
      - name: Build static export
        env:
          # GitHub Pages serves under /<repo-name>/ — must match the repo exactly.
          NEXT_PUBLIC_BASE_PATH: /24-hours-on-earth
          # Public serverless router that interprets "Ask the data" questions into
          # structured queries. Public endpoint (no secret) — the API key lives
          # only as a Cloudflare Worker secret. Unset ⇒ the box uses the local parser.
          NEXT_PUBLIC_ROUTER_URL: https://ask-the-data-router.prasanth-vs.workers.dev
        run: npm run build
      - name: Disable Jekyll (keep _next folder)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
